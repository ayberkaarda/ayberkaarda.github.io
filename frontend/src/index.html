  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0E0F13">
  <script>
    (function () {
      var d = document.documentElement, t, m;
      try { t = localStorage.getItem('theme-pref'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      d.setAttribute('data-theme', t);
      m = document.querySelector('meta[name="color-scheme"]');
      if (m) m.setAttribute('content', t);
      m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'light' ? '#F4F1EA' : '#0E0F13');
    })();
  </script>
